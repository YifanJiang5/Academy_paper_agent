# Modular RAG MCP Server - Configuration

llm:
  provider: "openai"
  model: "kimi-k2.5"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.moonshot.cn/v1"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"
  model: "Qwen/Qwen3-Embedding-8B"
  dimensions: 4096
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: "${SILICON_FLOW_API_KEY}"
  base_url: "https://api.siliconflow.cn/v1"

vision_llm:
  enabled: true
  provider: "openai"
  model: "kimi-k2.5"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.moonshot.cn/v1"
  max_image_size: 2048
  temperature: 1.0

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: true
  provider: "llm"
  model: "kimi-k2.5"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
